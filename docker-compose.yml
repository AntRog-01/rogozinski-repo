services:
  svcdesk:
    build: .
    ports:
      - "8080:8080"
    environment:
      SVCDESK_TEST_CLOCK: "1"
      SVCDESK_DB: "/data/svcdesk.db"
    volumes:
      - svcdesk-data:/data

  tests:
    profiles: ["tests"]
    build:
      context: .
      dockerfile: Dockerfile.tests

volumes:
  svcdesk-data:
