# ai-generated: 90% - promtool unit tests killing mutant alert rules
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # Test 1: KbSearchErrorsBurnFast (L=1h, S=5m, for=2m, threshold=0.144)
  # 600 req/min (10 req/s), healthy for 70 min.
  # From 71m: 30% errors (180 bad, 420 good).
  # 1h ratio crosses 14.4% at m=29 (minute 99m).
  # Pending from 99m, firing after 2m at 101m.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+600x70 42420+420x60'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0x70 180+180x60'
    alert_rule_test:
      # Lower edge: kills `for - 5m` and `threshold / 1.5`
      - eval_time: 100m
        alertname: KbSearchErrorsBurnFast
        exp_alerts: []
      # Upper edge: kills `for + 5m` and `threshold x 1.5`
      - eval_time: 101m
        alertname: KbSearchErrorsBurnFast
        exp_alerts:
          - exp_labels:
              service: svcdesk
              slo: availability
              severity: P1
            exp_annotations:
              summary: "High error burn rate on /kb/search: 14.4x consuming 2% of budget in 1 hour"

  # Test 2: KbSearchErrorsBurnSlow (L=6h, S=30m, for=5m, threshold=0.06)
  # 600 req/min, healthy for 370 min (fills 6h window).
  # From 371m: 15% errors (90 bad, 510 good).
  # 6h ratio crosses 6% at m=144 (minute 514m).
  # Pending from 514m, firing after 5m at 519m.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+600x370 222510+510x180'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0x370 90+90x180'
    alert_rule_test:
      # Lower edge: kills `for - 5m` and `threshold / 1.5`
      - eval_time: 518m
        alertname: KbSearchErrorsBurnSlow
        exp_alerts: []
      # Upper edge: kills `for + 5m` and `threshold x 1.5`
      - eval_time: 519m
        alertname: KbSearchErrorsBurnSlow
        exp_alerts:
          - exp_labels:
              service: svcdesk
              slo: availability
              severity: P2
            exp_annotations:
              summary: "Slow error burn rate on /kb/search: 6x consuming 5% of budget in 6 hours"
